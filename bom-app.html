<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart-Hanger BOM</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; background: #16191c; }
  * { box-sizing: border-box; }
  ::selection { background: #00E5D1; color: #16191c; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useRef, Fragment } = React;

const MAX_SLOTS = 20;

// CSV cells: quote-aware split/join (RFC 4180 style). A field wrapped in double
// quotes may contain commas and doubled "" quotes — Revit Mark/Comments text does.
// Newlines inside a quoted field are NOT handled (rows are split on line breaks first).
function splitCSVLine(line) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function joinCSVLine(cells) {
  return cells.map((c) => (/[",\r\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c)).join(",");
}

// ---- PARSE (column mapping by header name) ----
function parseCSV(text) {
  if (!text || !text.trim()) return { hangers: [], error: null, empty: true };
  const lines = text.replace(/\r/g, "").split("\n").filter((l) => l.length > 0);
  const rows = lines.map(splitCSVLine);
  const headerIdx = rows.findIndex((r) => r.includes("IronLength"));
  if (headerIdx === -1) return { hangers: [], error: "No header row found (missing 'IronLength' column)." };

  const header = rows[headerIdx].map((h) => h.trim());
  const col = (name) => header.indexOf(name);
  const cType = col("Family and Type"), cBar = col("IronLength"), cMark = col("Mark"), cComments = col("Comments");
  if (col("SH_1_ThreadLength") === -1) {
    return { hangers: [], error: "Old export — no rod ThreadLength columns (SH_n_ThreadLength). Re-export from Revit before loading." };
  }

  const hangers = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    const type = (r[cType] || "").trim();
    if (!type) continue;
    const slots = [];
    for (let n = 1; n <= MAX_SLOTS; n++) {
      const d = parseFloat(r[col(`SH_${n}_D`)]);
      const x = parseFloat(r[col(`SH_${n}_X`)]);
      const tl = parseFloat(r[col(`SH_${n}_ThreadLength`)]); // rod CUT length (Y is centerline — unused)
      if (Number.isNaN(d)) continue;
      slots.push({ slot: n, diameter: d, position: x, rodLength: tl });
    }
    const id = ((r[cComments] || "").trim()) || ((r[cMark] || "").trim()) || `row ${i - headerIdx}`; // Comments → Mark → row N (same as widget)
    hangers.push({ id, type, barLength: parseFloat(r[cBar]) || 0, slots });
  }
  return { hangers, error: null };
}

// ---- CLEANUP (drop filler D===1, sort by position) ----
function cleanHanger(h) {
  // markOnly: slot has a clamp position but no ThreadLength (blank in the export) —
  // a rod-marker position: the operator pen-marks it, no rod is cut, no clamp fitted.
  const clamps = h.slots.filter((s) => s.diameter !== 1).sort((a, b) => a.position - b.position)
    .map((s) => ({ ...s, markOnly: Number.isNaN(s.rodLength) }));
  return { ...h, clamps };
}

// ---- aggregate one file's cleaned hangers into fixed totals ----
function computeTotals(cleaned) {
  let barLen = 0, rodLen = 0, clampCount = 0, rodMarks = 0;
  const clampByDia = {};
  cleaned.forEach((h) => {
    barLen += h.barLength;
    h.clamps.forEach((c) => {
      if (c.markOnly) { rodMarks += 1; return; } // pen mark only — no rod, no clamp
      rodLen += c.rodLength;
      clampByDia[c.diameter] = (clampByDia[c.diameter] || 0) + 1;
      clampCount += 1;
    });
  });
  return { barCount: cleaned.length, barLen, rodLen, clampByDia, clampCount, rodMarks };
}
function customComputed(rows, totals) {
  return rows.map((row) => {
    const basisCount = row.basis === "bar" ? totals.barCount : totals.clampCount;
    const q = parseFloat(row.qty);
    return { ...row, basisCount, total: Number.isNaN(q) ? 0 : q * basisCount };
  });
}
function clampRowsFromDia(dia) {
  return Object.keys(dia).map(Number).sort((a, b) => a - b).map((d) => ({ label: `Clamp: ${d}mm`, qty: dia[d] }));
}

const C = {
  bg: "#16191c", panel: "#1c1f23", panel2: "#22262b", border: "#2a2e33",
  borderHi: "#3a4046", text: "#e8eaed", dim: "#8a9099", faint: "#6a7078",
  accent: "#00E5D1", danger: "#ff5a5a",
};
const MONO = "ui-monospace, 'SF Mono', Menlo, monospace";

// ---- inline icons ----
const Svg = (p) => <svg width={p.s||14} height={p.s||14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">{p.children}</svg>;
const IPlus  = (p) => <Svg s={p.s}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Svg>;
const IX     = (p) => <Svg s={p.s}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Svg>;
const ICopy  = (p) => <Svg s={p.s}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Svg>;
const IUpload= (p) => <Svg s={p.s}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></Svg>;
const ICheck = (p) => <Svg s={p.s}><polyline points="20 6 9 17 4 12"/></Svg>;
const IChevron = (p) => <Svg s={p.s}><polyline points={p.open ? "6 9 12 15 18 9" : "9 18 15 12 9 6"}/></Svg>;
const ITrash = (p) => <Svg s={p.s}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Svg>;

// ---- shared style bits ----
const sectionLabel = { fontSize: "10px", color: C.faint, letterSpacing: "0.18em", marginBottom: "8px" };
const cell = { padding: "5px 10px", borderBottom: `1px solid ${C.border}`, whiteSpace: "nowrap" };
const th = { ...cell, color: C.faint, fontSize: "10px", letterSpacing: "0.08em", textAlign: "left", borderBottom: `1px solid ${C.borderHi}` };

// ---- robust copy ----
function copyTSV(tsv, onFlash, onFail) {
  (async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(tsv); onFlash(); return; }
    } catch (e) {}
    try {
      const ta = document.createElement("textarea");
      ta.value = tsv; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand("copy"); document.body.removeChild(ta);
      if (ok) { onFlash(); return; }
    } catch (e) {}
    onFail();
  })();
}

// ---- reusable BOM table + copy ----
function BomTable({ title, fixedRows, customRows }) {
  const [copied, setCopied] = useState(false);
  const [showBox, setShowBox] = useState(false);
  const boxRef = useRef(null);
  const rows = [...fixedRows, ...customRows];
  const tsv = rows.map((r) => `${r.label}\t${r.qty}`).join("\n");
  const onCopy = () => copyTSV(tsv,
    () => { setCopied(true); setTimeout(() => setCopied(false), 1400); },
    () => { setShowBox(true); setTimeout(() => boxRef.current && (boxRef.current.focus(), boxRef.current.select()), 0); });

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
        <div style={{ ...sectionLabel, marginBottom: 0 }}>{title}</div>
        <button onClick={onCopy} style={{ background: copied ? C.accent : "transparent", color: copied ? C.bg : C.dim, border: `1px solid ${copied ? C.accent : C.borderHi}`, padding: "6px 12px", fontFamily: MONO, fontSize: "10px", letterSpacing: "0.1em", cursor: "pointer", display: "flex", alignItems: "center", gap: "7px", fontWeight: 600 }}>
          {copied ? <><ICheck s={13} /> COPIED</> : <><ICopy s={13} /> COPY FOR SHEETS</>}
        </button>
      </div>
      <div style={{ background: C.panel, border: `1px solid ${C.border}` }}>
        <table style={{ borderCollapse: "collapse", width: "100%", fontSize: "13px" }}>
          <thead><tr>
            <th style={{ ...th, fontSize: "10px" }}>PRODUCT</th>
            <th style={{ ...th, fontSize: "10px", textAlign: "right" }}>QTY</th>
          </tr></thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}>
                <td style={{ ...cell, color: C.text }}>{r.label}</td>
                <td style={{ ...cell, color: C.accent, textAlign: "right", fontWeight: 700, fontVariantNumeric: "tabular-nums" }}>{r.qty}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {showBox && (
        <textarea ref={boxRef} readOnly value={tsv} onFocus={(e) => e.target.select()}
          style={{ width: "100%", height: "120px", marginTop: "8px", background: C.panel2, color: C.text, border: `1px solid ${C.accent}`, fontFamily: MONO, fontSize: "12px", padding: "8px", resize: "vertical" }} />
      )}
    </div>
  );
}

// ============================================================
// PANE — one CSV file
// ============================================================
function Pane({ pane, derived, onUpdate, onRemove }) {
  const [collapsed, setCollapsed] = useState(false);
  const [topView, setTopView] = useState("cleaned");
  const [confirm, setConfirm] = useState(false);
  const fileRef = useRef(null);
  const pendingReset = useRef(true); // for the fallback <input>: reset custom items or not

  const { hangers, cleaned, totals, error, empty } = derived;
  const fixedRows = empty ? [] : [
    { label: "Base bar (total mm)", qty: totals.barLen },
    { label: "Threaded rod (total mm)", qty: totals.rodLen },
    ...clampRowsFromDia(totals.clampByDia),
    ...(totals.rodMarks ? [{ label: "Rod marks (pen only, no rod/clamp)", qty: totals.rodMarks }] : []),
  ];
  const cc = empty ? [] : customComputed(pane.customRows, totals);
  const customBomRows = cc.filter((r) => (r.label || "").trim() && r.total).map((r) => ({ label: r.label.trim(), qty: r.total }));

  const summary = empty ? "no file loaded" : `${totals.barCount} hangers · ${totals.clampCount} clamps${totals.rodMarks ? ` · ${totals.rodMarks} rod marks` : ""}`;

  const addRow = () => onUpdate({ customRows: [...pane.customRows, { qty: "", label: "", basis: "clamp" }] });
  const updateRow = (i, patch) => onUpdate({ customRows: pane.customRows.map((r, j) => (j === i ? { ...r, ...patch } : r)) });
  const removeRow = (i) => onUpdate({ customRows: pane.customRows.filter((_, j) => j !== i) });

  // LOAD — prefer File System Access API so we keep a re-readable handle.
  // resetCustom=true wipes custom items (fresh file); false keeps them.
  const doLoad = async (resetCustom) => {
    if (window.showOpenFilePicker) {
      try {
        const [handle] = await window.showOpenFilePicker({
          multiple: false,
          types: [{ description: "CSV", accept: { "text/csv": [".csv"], "text/plain": [".csv"] } }],
        });
        const file = await handle.getFile();
        const text = await file.text();
        onUpdate({ csvText: text, fileName: file.name, handle, file: null, ...(resetCustom ? { customRows: [] } : {}) });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return; // user cancelled
        // otherwise fall through to the classic <input>
      }
    }
    pendingReset.current = resetCustom;
    if (fileRef.current) fileRef.current.click();
  };

  // fallback path: classic <input type=file>
  const onFileInput = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => onUpdate({
      csvText: String(reader.result), fileName: f.name, handle: null, file: f,
      ...(pendingReset.current ? { customRows: [] } : {}),
    });
    reader.readAsText(f);
    e.target.value = ""; // allow re-selecting the same file
  };

  // RELOAD — re-read the SAME file from disk, keep custom items.
  const reload = async () => {
    if (pane.handle) {
      try {
        const file = await pane.handle.getFile();
        const text = await file.text();
        onUpdate({ csvText: text, fileName: file.name }); // customRows untouched
        return;
      } catch (e) { /* handle lost — fall through */ }
    }
    if (pane.file) {
      try {
        const text = await pane.file.text();
        onUpdate({ csvText: text }); // customRows untouched
        return;
      } catch (e) { /* stale snapshot — fall through */ }
    }
    doLoad(false); // no usable handle: re-pick, keep custom items
  };

  return (
    <div style={{ border: `1px solid ${confirm ? C.danger : C.borderHi}`, marginBottom: "16px", background: C.bg }}>
      {/* PANE HEADER */}
      {confirm ? (
        <div style={{ display: "flex", alignItems: "center", gap: "14px", padding: "12px 14px", background: "rgba(255,90,90,0.08)", flexWrap: "wrap" }}>
          <span style={{ color: C.danger, fontSize: "13px", fontWeight: 600 }}>Remove “{pane.fileName}” from this session?</span>
          <span style={{ color: C.faint, fontSize: "11px" }}>(your CSV file is not touched)</span>
          <div style={{ marginLeft: "auto", display: "flex", gap: "8px" }}>
            <button onClick={() => setConfirm(false)} style={{ background: "transparent", color: C.dim, border: `1px solid ${C.borderHi}`, padding: "7px 14px", fontFamily: MONO, fontSize: "11px", letterSpacing: "0.1em", cursor: "pointer" }}>CANCEL</button>
            <button onClick={onRemove} style={{ background: C.danger, color: C.bg, border: "none", padding: "7px 14px", fontFamily: MONO, fontSize: "11px", letterSpacing: "0.1em", cursor: "pointer", fontWeight: 700 }}>REMOVE</button>
          </div>
        </div>
      ) : (
        <div style={{ display: "flex", alignItems: "center", gap: "10px", padding: "12px 14px", borderBottom: collapsed ? "none" : `1px solid ${C.border}` }}>
          <div onClick={() => setCollapsed(!collapsed)} style={{ display: "flex", alignItems: "center", gap: "10px", cursor: "pointer", flex: 1, minWidth: 0 }}>
            <span style={{ color: C.faint, display: "flex" }}><IChevron open={!collapsed} s={16} /></span>
            <span style={{ fontSize: "15px", fontWeight: 600, color: empty ? C.faint : C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{pane.fileName}</span>
            <span style={{ fontSize: "11px", color: C.dim, whiteSpace: "nowrap" }}>{summary}</span>
          </div>
          <button onClick={() => (empty ? doLoad(true) : reload())} style={{ background: "transparent", color: C.dim, border: `1px solid ${C.borderHi}`, padding: "6px 12px", fontFamily: MONO, fontSize: "10px", letterSpacing: "0.1em", cursor: "pointer", display: "flex", alignItems: "center", gap: "7px" }}>
            <IUpload s={13} /> {empty ? "LOAD CSV" : "RELOAD"}
          </button>
          <button title="Remove pane" onClick={() => setConfirm(true)} style={{ background: "transparent", color: C.danger, border: `1px solid ${C.danger}`, padding: "6px", cursor: "pointer", display: "flex", alignItems: "center" }}>
            <ITrash s={15} />
          </button>
          <input ref={fileRef} type="file" accept=".csv,text/csv" onChange={onFileInput} style={{ display: "none" }} />
        </div>
      )}

      {/* PANE BODY */}
      {!collapsed && !confirm && (
        <div style={{ padding: "16px" }}>
          {error && <div style={{ color: C.danger, fontSize: "12px", marginBottom: "14px" }}>{error}</div>}
          {empty ? (
            <div style={{ color: C.faint, fontSize: "13px", padding: "20px", textAlign: "center" }}>
              Click <strong style={{ color: C.dim }}>LOAD CSV</strong> to import a Revit smart-hanger export.
            </div>
          ) : (
            <>
              {/* IMPORTED DATA */}
              <div style={{ marginBottom: "24px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
                  <div style={{ ...sectionLabel, marginBottom: 0 }}>IMPORTED DATA</div>
                  <div style={{ display: "flex", border: `1px solid ${C.borderHi}` }}>
                    {["raw", "cleaned"].map((v) => (
                      <button key={v} onClick={() => setTopView(v)} style={{ background: topView === v ? C.accent : "transparent", color: topView === v ? C.bg : C.dim, border: "none", padding: "6px 14px", fontFamily: MONO, fontSize: "10px", letterSpacing: "0.15em", cursor: "pointer", fontWeight: 600 }}>{v.toUpperCase()}</button>
                    ))}
                  </div>
                </div>
                <div style={{ background: C.panel, border: `1px solid ${C.border}`, overflowX: "auto", maxHeight: "300px", overflowY: "auto" }}>
                  {topView === "raw" ? (
                    <table style={{ borderCollapse: "collapse", fontSize: "11px", width: "100%" }}>
                      <thead><tr>
                        <th style={th}>ID</th><th style={th}>BAR</th>
                        {Array.from({ length: MAX_SLOTS }, (_, i) => <th key={i} style={th} colSpan={3}>SH_{i + 1} (D·X·Y)</th>)}
                      </tr></thead>
                      <tbody>
                        {hangers.map((h) => (
                          <tr key={h.id}>
                            <td style={{ ...cell, color: C.text }}>{h.id}</td>
                            <td style={{ ...cell, color: C.dim }}>{h.barLength}</td>
                            {Array.from({ length: MAX_SLOTS }, (_, i) => {
                              const s = h.slots.find((sl) => sl.slot === i + 1);
                              const filler = s && s.diameter === 1;
                              const c = { ...cell, color: filler ? C.borderHi : C.dim, textAlign: "right", padding: "5px 6px" };
                              return s ? (
                                <Fragment key={i}>
                                  <td style={{ ...c, color: filler ? C.borderHi : C.accent }}>{s.diameter}</td>
                                  <td style={c}>{s.position}</td>
                                  <td style={c}>{s.rodLength}</td>
                                </Fragment>
                              ) : <td key={i} style={c} colSpan={3}>—</td>;
                            })}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  ) : (
                    <table style={{ borderCollapse: "collapse", fontSize: "12px", width: "100%" }}>
                      <thead><tr>
                        <th style={th}>ID</th><th style={th}>BAR (mm)</th><th style={th}>#</th>
                        <th style={{ ...th, width: "100%" }}>CLAMPS · Ø@pos ·rod (sorted by position)</th>
                      </tr></thead>
                      <tbody>
                        {cleaned.map((h) => (
                          <tr key={h.id}>
                            <td style={{ ...cell, color: C.text }}>{h.id}</td>
                            <td style={{ ...cell, color: C.dim }}>{h.barLength}</td>
                            <td style={{ ...cell, color: C.dim }}>{h.clamps.filter((c) => !c.markOnly).length}</td>
                            <td style={{ ...cell, color: C.dim, whiteSpace: "normal" }}>
                              {h.clamps.map((c, i) => c.markOnly ? (
                                <span key={i} style={{ marginRight: "14px", display: "inline-block" }}>
                                  <span style={{ color: C.dim }}>ROD MARK</span>
                                  <span style={{ color: C.faint }}>@{c.position}</span>
                                </span>
                              ) : (
                                <span key={i} style={{ marginRight: "14px", display: "inline-block" }}>
                                  <span style={{ color: C.accent }}>Ø{c.diameter}</span>
                                  <span style={{ color: C.faint }}>@{c.position}</span>
                                  <span style={{ color: C.dim }}> ·{c.rodLength}</span>
                                </span>
                              ))}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>

              <div style={{ display: "flex", gap: "24px", flexWrap: "wrap", alignItems: "flex-start" }}>
                {/* CUSTOM ITEMS */}
                <div style={{ flex: "1 1 360px", minWidth: "300px" }}>
                  <div style={sectionLabel}>CUSTOM ITEMS</div>
                  <div style={{ background: C.panel, border: `1px solid ${C.border}`, padding: "14px" }}>
                    {pane.customRows.length === 0 && (
                      <div style={{ color: C.faint, fontSize: "11px", padding: "6px 0 14px" }}>No custom items. Add nuts, washers, bolts… per bar or per clamp.</div>
                    )}
                    {pane.customRows.map((row, i) => {
                      const c = cc[i];
                      return (
                        <div key={i} style={{ display: "flex", flexDirection: "column", gap: "6px", marginBottom: "14px" }}>
                          <div style={{ display: "flex", gap: "6px", alignItems: "center" }}>
                            <input type="number" inputMode="numeric" placeholder="qty" value={row.qty}
                              onChange={(e) => updateRow(i, { qty: e.target.value })}
                              style={{ width: "58px", background: C.panel2, color: C.text, border: `1px solid ${C.borderHi}`, padding: "8px", fontFamily: MONO, fontSize: "13px", textAlign: "center" }} />
                            <span style={{ color: C.faint }}>×</span>
                            <input type="text" placeholder="e.g. 43mm washer" value={row.label}
                              onChange={(e) => updateRow(i, { label: e.target.value })}
                              style={{ flex: 1, background: C.panel2, color: C.text, border: `1px solid ${C.borderHi}`, padding: "8px", fontFamily: MONO, fontSize: "13px", minWidth: "80px" }} />
                            <button onClick={() => removeRow(i)} style={{ background: "transparent", border: `1px solid ${C.borderHi}`, color: C.faint, cursor: "pointer", padding: "8px", display: "flex", alignItems: "center" }}><IX /></button>
                          </div>
                          <div style={{ display: "flex", gap: "8px", alignItems: "center", paddingLeft: "70px" }}>
                            <div style={{ display: "flex", border: `1px solid ${C.borderHi}` }}>
                              {[["bar", "PER BAR"], ["clamp", "PER CLAMP"]].map(([val, lbl]) => (
                                <button key={val} onClick={() => updateRow(i, { basis: val })} style={{ background: row.basis === val ? C.accent : "transparent", color: row.basis === val ? C.bg : C.dim, border: "none", padding: "5px 10px", fontFamily: MONO, fontSize: "9px", letterSpacing: "0.12em", cursor: "pointer", fontWeight: 600 }}>{lbl}</button>
                              ))}
                            </div>
                            <div style={{ fontSize: "11px", color: C.faint }}>
                              {(parseFloat(row.qty) || 0)} × {c.basisCount} {row.basis === "bar" ? "bars" : "clamps"} = <span style={{ color: C.accent, fontWeight: 700 }}>{c.total}</span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                    <button onClick={addRow} style={{ width: "100%", background: "transparent", color: C.accent, border: `1px dashed ${C.borderHi}`, padding: "10px", fontFamily: MONO, fontSize: "11px", letterSpacing: "0.12em", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: "8px" }}><IPlus /> ADD ITEM</button>
                  </div>
                </div>

                {/* PER-FILE BOM */}
                <div style={{ flex: "1 1 360px", minWidth: "300px" }}>
                  <BomTable title="BILL OF MATERIALS (this file)" fixedRows={fixedRows} customRows={customBomRows} />
                </div>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// ============================================================
// APP — owns all panes, builds grand total
// ============================================================
let UID = 1;
const makePane = (csvText = "", fileName = "(no file)") => ({ id: UID++, csvText, fileName, customRows: [], handle: null, file: null });

function App() {
  const [panes, setPanes] = useState([makePane()]);

  const derived = useMemo(() => panes.map((p) => {
    const parsed = parseCSV(p.csvText);
    if (parsed.empty) return { empty: true, hangers: [], cleaned: [], totals: computeTotals([]), error: null };
    const cleaned = parsed.hangers.map(cleanHanger);
    return { empty: false, hangers: parsed.hangers, cleaned, totals: computeTotals(cleaned), error: parsed.error };
  }), [panes]);

  const updatePane = (id, patch) => setPanes((ps) => ps.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  const removePane = (id) => setPanes((ps) => ps.filter((p) => p.id !== id));
  const addPane = () => setPanes((ps) => [...ps, makePane()]);

  // ---- grand total across all panes ----
  const grand = useMemo(() => {
    let barLen = 0, rodLen = 0, rodMarks = 0;
    const dia = {}, custom = {};
    panes.forEach((p, idx) => {
      const d = derived[idx];
      if (d.empty || d.error) return;
      barLen += d.totals.barLen;
      rodLen += d.totals.rodLen;
      rodMarks += d.totals.rodMarks || 0;
      Object.entries(d.totals.clampByDia).forEach(([k, n]) => { dia[k] = (dia[k] || 0) + n; });
      customComputed(p.customRows, d.totals).filter((r) => (r.label || "").trim() && r.total).forEach((r) => {
        const key = r.label.trim().toLowerCase();
        if (!custom[key]) custom[key] = { label: r.label.trim(), qty: 0 };
        custom[key].qty += r.total;
      });
    });
    const fixedRows = [
      { label: "Base bar (total mm)", qty: barLen },
      { label: "Threaded rod (total mm)", qty: rodLen },
      ...clampRowsFromDia(dia),
      ...(rodMarks ? [{ label: "Rod marks (pen only, no rod/clamp)", qty: rodMarks }] : []),
    ];
    return { fixedRows, customRows: Object.values(custom) };
  }, [panes, derived]);

  const loadedCount = derived.filter((d) => !d.empty && !d.error).length;

  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: MONO, padding: "20px", maxWidth: "1100px", margin: "0 auto" }}>
      <div style={{ borderBottom: `1px solid ${C.border}`, paddingBottom: "12px", marginBottom: "20px" }}>
        <div style={{ fontSize: "10px", color: C.faint, letterSpacing: "0.18em" }}>SMART-HANGER · BILL OF MATERIALS</div>
        <div style={{ fontSize: "18px", fontWeight: 600, marginTop: "4px" }}>{panes.length} file{panes.length === 1 ? "" : "s"} in session · {loadedCount} loaded</div>
      </div>

      {panes.map((p, idx) => (
        <Pane key={p.id} pane={p} derived={derived[idx]} onUpdate={(patch) => updatePane(p.id, patch)} onRemove={() => removePane(p.id)} />
      ))}

      <button onClick={addPane} style={{ width: "100%", background: "transparent", color: C.accent, border: `1px dashed ${C.accent}`, padding: "14px", fontFamily: MONO, fontSize: "12px", letterSpacing: "0.15em", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: "8px", marginBottom: "32px", fontWeight: 600 }}>
        <IPlus /> ADD CSV
      </button>

      {/* GRAND TOTAL */}
      <div style={{ borderTop: `2px solid ${C.accent}`, paddingTop: "20px" }}>
        <div style={{ fontSize: "11px", color: C.accent, letterSpacing: "0.2em", marginBottom: "12px", fontWeight: 700 }}>
          GRAND TOTAL · ALL FILES ({loadedCount})
        </div>
        <div style={{ maxWidth: "520px" }}>
          <BomTable title="COMBINED BILL OF MATERIALS" fixedRows={grand.fixedRows} customRows={grand.customRows} />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
